min_version = { soft = "2026.7.7" }

[tools]
aws-cli = "latest"
bat = "latest"
claude-code = "latest"
delta = "latest"
difftastic = "latest"
fd = "latest"
gh = "latest"
gitleaks = "latest"
go = "1.26"
peco = "latest"
pnpm = "11"
node = "24"
python = "3.14"
ripgrep = "latest"
uv = "0.12"
tlrc = "latest"

[settings]
plugin_autoupdate_last_check_duration = "4320" # 3 days
# brew-cask downloads reuse this timeout, so large .app archives need well over the 20s default
fetch_remote_versions_timeout = "10m"
